# Dependabot's version updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# The workflows are the only thing in this repository Dependabot can track.
# ext4magic is C built with autotools : what it links against, e2fsprogs and
# libmagic, comes from the runner's apt archive rather than from a manifest,
# and the autotools helpers checked in at the root (config.guess, config.sub,
# ltmain.sh, ...) are vendored copies no ecosystem reads. There is no
# Dockerfile, no devcontainer and no submodule.
#
# Minor and patch updates are grouped and merge themselves once the checks
# .github/rulesets/master.json requires are green on them, which is what
# .github/workflows/dependabot-auto-merge.yml asks GitHub to do. Majors stay
# out of the group, one pull request each, and wait for a person.
#
# As things stand that is every update this entry raises. Each action is used
# at its major tag (actions/checkout@v7), and Dependabot keeps a ref at the
# precision it finds it in : it offers v7 -> v8, never v7 -> v7.1. The group is
# for whatever comes to be pinned more finely, not for anything here today.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Opening a pull request is the only way Dependabot reports anything, and it
    # stops opening them once this many are waiting -- silently, naming nothing.
    # The default is 5, and majors sit one pull request each until reviewed, so
    # the queue fills up. 99 rather than 0 : zero does not mean "no limit", it
    # turns version updates off and leaves only the security ones
    open-pull-requests-limit: 99
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
